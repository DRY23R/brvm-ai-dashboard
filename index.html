<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRVM AI Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .card {
      background: #151b2f;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .score {
      font-size: 32px;
      font-weight: 700;
    }

    .green {
      color: #34d399;
    }

    .yellow {
      color: #fbbf24;
    }

    .red {
      color: #f87171;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: #d1d5db;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #26304f;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>BRVM AI</h1>
    <div class="subtitle">Trading & Investment Scanner</div>

    <div id="cards-container"></div>

  </div>
<script>
fetch('dashboard.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('cards-container');
    container.innerHTML = '';

    data.forEach(item => {
      const scoreClass = item.score >= 77 ? 'green' : 'yellow';

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div>${item.symbol}</div>
        <div class="score ${scoreClass}">${item.score}/100</div>

        <div class="row">
          <span>Cours</span>
          <span>${item.price} FCFA</span>
        </div>

        <div class="row">
          <span>Variation</span>
          <span>${item.variation} %</span>
        </div>

        <div class="row">
          <span>Liquidité</span>
          <span>${item.liquidity}/100</span>
        </div>

        <div class="status">Données mises à jour automatiquement</div>
      `;

      container.appendChild(card);
    });
  })
  .catch(error => {
    console.error('Erreur dashboard:', error);
  });
</script>
</body>
</html>
