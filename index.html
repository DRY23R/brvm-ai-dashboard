<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">

  <title>BRVM AI — Trading & Investment Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 18px;
    }

    .updated {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #29304f;
      background: #11172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search::placeholder {
      color: #6b7280;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      border: 1px solid #29304f;
      background: #151b2f;
      color: #d1d5db;
      padding: 9px 13px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #2b355c;
      color: #ffffff;
      border-color: #46558e;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .summary-box {
      background: #11172a;
      border: 1px solid #1d2540;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .summary-number {
      display: block;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .summary-label {
      color: #8f98ab;
      font-size: 12px;
    }

    .card {
      position: relative;
      background: #151b2f;
      border: 1px solid #1b2340;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 17px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .company-block {
      min-width: 0;
    }

    .symbol-line {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .rank {
      background: #242c49;
      color: #aeb8d4;
      padding: 4px 8px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .symbol {
      font-size: 21px;
      font-weight: 600;
    }

    .company-name {
      margin-top: 5px;
      color: #8f98ab;
      font-size: 13px;
      line-height: 1.3;
    }

    .signal {
      padding: 7px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .3px;
      flex-shrink: 0;
    }

    .signal-buy {
      background: rgba(52, 211, 153, .14);
      color: #34d399;
    }

    .signal-watch {
      background: rgba(251, 191, 36, .14);
      color: #fbbf24;
    }

    .signal-avoid {
      background: rgba(248, 113, 113, .14);
      color: #f87171;
    }

    .global-label {
      margin-top: 14px;
      color: #8f98ab;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .global-score {
      font-size: 40px;
      font-weight: 800;
      margin: 3px 0 16px;
      letter-spacing: -1px;
    }

    .score-high {
      color: #34d399;
    }

    .score-medium {
      color: #fbbf24;
    }

    .score-low {
      color: #f87171;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .score-box {
      background: #11172a;
      border: 1px solid #242c49;
      border-radius: 13px;
      padding: 12px;
    }

    .score-box-label {
      color: #8f98ab;
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .score-box-value {
      font-size: 20px;
      font-weight: 700;
    }

    .confidence {
      margin-top: 5px;
      color: #737e96;
      font-size: 11px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin: 11px 0;
      font-size: 17px;
      color: #d1d5db;
    }

    .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .positive {
      color: #34d399;
    }

    .negative {
      color: #f87171;
    }

    .neutral {
      color: #d1d5db;
    }

    .liquidity-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .liq-high {
      background: rgba(52, 211, 153, .12);
      color: #34d399;
    }

    .liq-medium {
      background: rgba(251, 191, 36, .12);
      color: #fbbf24;
    }

    .liq-low {
      background: rgba(248, 113, 113, .12);
      color: #f87171;
    }

    .fundamentals {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #242c49;
    }

    .fundamentals-title {
      color: #8f98ab;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .small-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 7px 0;
      font-size: 13px;
      color: #9ca3af;
    }

    .history {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #242c49;
      color: #737e96;
      font-size: 12px;
      line-height: 1.5;
    }

    .empty,
    .error {
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-top: 20px;
    }

    .empty {
      background: #151b2f;
      color: #9ca3af;
    }

    .error {
      background: rgba(248, 113, 113, .12);
      color: #fca5a5;
    }

    .footer-note {
      margin-top: 26px;
      color: #596277;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (min-width: 700px) {
      .toolbar {
        flex-direction: row;
        align-items: center;
      }

      .search {
        flex: 1;
      }

      .filters {
        flex-shrink: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BRVM AI</h1>

    <div class="subtitle">
      Trading & Investment Scanner
    </div>

    <div id="updated" class="updated">
      Chargement des données…
    </div>

    <div class="toolbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Rechercher une action ou une entreprise…"
        autocomplete="off"
      >

      <div class="filters">
        <button class="filter-btn active" data-filter="ALL">Tous</button>
        <button class="filter-btn" data-filter="ACHAT">Achat</button>
        <button class="filter-btn" data-filter="SURVEILLER">Surveiller</button>
        <button class="filter-btn" data-filter="EVITER">Éviter</button>
      </div>

    </div>

    <div class="summary">
      <div class="summary-box">
        <span id="count-buy" class="summary-number">0</span>
        <span class="summary-label">ACHAT</span>
      </div>

      <div class="summary-box">
        <span id="count-watch" class="summary-number">0</span>
        <span class="summary-label">SURVEILLER</span>
      </div>

      <div class="summary-box">
        <span id="count-avoid" class="summary-number">0</span>
        <span class="summary-label">ÉVITER</span>
      </div>
    </div>

    <div id="cards-container"></div>

    <div class="footer-note">
      BRVM AI combine des indicateurs de marché et des données fondamentales.
      Les scores sont calculés automatiquement à partir des données disponibles
      et ne constituent pas un conseil financier personnalisé.
    </div>

  </div>

  <script>
    let allStocks = [];
    let currentFilter = 'ALL';

    function safeNumber(value, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function getSignal(item) {
      const signal = String(item.signal || '').toUpperCase();

      if (signal === 'ACHAT') return 'ACHAT';
      if (signal === 'EVITER') return 'EVITER';

      return 'SURVEILLER';
    }

    function getSignalClass(signal) {
      if (signal === 'ACHAT') return 'signal-buy';
      if (signal === 'SURVEILLER') return 'signal-watch';
      return 'signal-avoid';
    }

    function getScoreClass(score) {
      if (score >= 75) return 'score-high';
      if (score >= 60) return 'score-medium';
      return 'score-low';
    }

    function getLiquidityClass(liquidity) {
      if (liquidity >= 70) return 'liq-high';
      if (liquidity >= 40) return 'liq-medium';
      return 'liq-low';
    }

    function formatVariation(value) {
      const number = safeNumber(value);
      const sign = number > 0 ? '+' : '';

      return `${sign}${number.toFixed(2)} %`;
    }

    function variationClass(value) {
      const number = safeNumber(value);

      if (number > 0) return 'positive';
      if (number < 0) return 'negative';

      return 'neutral';
    }

    function formatPrice(value) {
      const number = safeNumber(value);

      return `${Math.round(number).toLocaleString('fr-FR')} FCFA`;
    }

    function formatScore(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return 'N/D';
      }

      return `${Math.round(number)}/100`;
    }

    function formatPER(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) return 'N/D';

      return number.toFixed(2);
    }

    function formatMarketCap(value) {
      const number = Number(value);

      if (!Number.isFinite(number) || number <= 0) {
        return 'N/D';
      }

      if (number >= 1000000000000) {
        return `${(number / 1000000000000).toFixed(2)} T FCFA`;
      }

      if (number >= 1000000000) {
        return `${(number / 1000000000).toFixed(1)} Md FCFA`;
      }

      if (number >= 1000000) {
        return `${(number / 1000000).toFixed(1)} M FCFA`;
      }

      return `${Math.round(number).toLocaleString('fr-FR')} FCFA`;
    }

    function updateSummary(stocks) {
      const buy =
        stocks.filter(item => item.signalCalculated === 'ACHAT').length;

      const watch =
        stocks.filter(item => item.signalCalculated === 'SURVEILLER').length;

      const avoid =
        stocks.filter(item => item.signalCalculated === 'EVITER').length;

      document.getElementById('count-buy').textContent = buy;
      document.getElementById('count-watch').textContent = watch;
      document.getElementById('count-avoid').textContent = avoid;
    }

    function renderCards() {
      const container =
        document.getElementById('cards-container');

      const searchText =
        document
          .getElementById('search')
          .value
          .trim()
          .toLowerCase();

      const filtered =
        allStocks.filter(item => {
          const symbol =
            String(item.symbol || '').toLowerCase();

          const company =
            String(item.name || '').toLowerCase();

          const matchesSearch =
            !searchText ||
            symbol.includes(searchText) ||
            company.includes(searchText);

          const matchesFilter =
            currentFilter === 'ALL' ||
            item.signalCalculated === currentFilter;

          return matchesSearch && matchesFilter;
        });

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML =
          '<div class="empty">Aucune action ne correspond à votre recherche.</div>';

        return;
      }

      filtered.forEach(item => {
        const globalScore =
          safeNumber(item.global_score);

        const tradingScore =
          safeNumber(item.trading_score);

        const fundamentalScore =
          Number(item.fundamental_score);

        const fundamentalConfidence =
          safeNumber(item.fundamental_confidence);

        const liquidity =
          safeNumber(item.liquidity_score);

        const variation =
          safeNumber(item.variation_pct);

        const historyPoints =
          safeNumber(item.history_points);

        const card =
          document.createElement('div');

        card.className = 'card';

        const fundamentalAvailable =
          Number.isFinite(fundamentalScore) &&
          fundamentalConfidence > 0;

        const historyText =
          item.history_ready
            ? `Historique suffisant · ${historyPoints} observations`
            : `Historique en accumulation · ${historyPoints} observation${historyPoints > 1 ? 's' : ''}`;

        card.innerHTML = `
          <div class="card-header">

            <div class="company-block">

              <div class="symbol-line">
                <span class="rank">#${item.rank}</span>
                <span class="symbol">${item.symbol || 'N/A'}</span>
              </div>

              <div class="company-name">
                ${item.name || ''}
              </div>

            </div>

            <div class="signal ${getSignalClass(item.signalCalculated)}">
              ${item.signalCalculated}
            </div>

          </div>

          <div class="global-label">
            Score global
          </div>

          <div class="global-score ${getScoreClass(globalScore)}">
            ${formatScore(globalScore)}
          </div>

          <div class="score-grid">

            <div class="score-box">
              <div class="score-box-label">
                Trading
              </div>

              <div class="score-box-value ${getScoreClass(tradingScore)}">
                ${formatScore(tradingScore)}
              </div>
            </div>

            <div class="score-box">
              <div class="score-box-label">
                Fondamental
              </div>

              <div class="score-box-value">
                ${
                  fundamentalAvailable
                    ? formatScore(fundamentalScore)
                    : 'N/D'
                }
              </div>

              <div class="confidence">
                ${
                  fundamentalAvailable
                    ? `Confiance : ${Math.round(fundamentalConfidence)} %`
                    : 'Données insuffisantes'
                }
              </div>
            </div>

          </div>

          <div class="row">
            <span>Cours</span>
            <span class="value">
              ${formatPrice(item.last_price)}
            </span>
          </div>

          <div class="row">
            <span>Variation</span>
            <span class="value ${variationClass(variation)}">
              ${formatVariation(variation)}
            </span>
          </div>

          <div class="row">
            <span>Liquidité</span>
            <span class="value">
              <span class="liquidity-badge ${getLiquidityClass(liquidity)}">
                ${Math.round(liquidity)}/100
              </span>
            </span>
          </div>

          <div class="fundamentals">

            <div class="fundamentals-title">
              Données fondamentales
            </div>

            <div class="small-row">
              <span>PER</span>
              <span>${formatPER(item.per)}</span>
            </div>

            <div class="small-row">
              <span>Performance YTD</span>
              <span class="${variationClass(item.ytd_change)}">
                ${formatVariation(item.ytd_change)}
              </span>
            </div>

            <div class="small-row">
              <span>Capitalisation</span>
              <span>${formatMarketCap(item.market_cap)}</span>
            </div>

            <div class="small-row">
              <span>Valorisation</span>
              <span>${formatScore(item.valuation_score)}</span>
            </div>

            <div class="small-row">
              <span>Dividende</span>
              <span>${formatScore(item.dividend_score)}</span>
            </div>

            <div class="small-row">
              <span>Score YTD</span>
              <span>${formatScore(item.ytd_score)}</span>
            </div>

          </div>

          <div class="history">
            ${historyText} · Signal calculé automatiquement
          </div>
        `;

        container.appendChild(card);
      });
    }

    fetch('dashboard.json?ts=' + Date.now())

      .then(response => {
        if (!response.ok) {
          throw new Error(
            'Impossible de charger dashboard.json'
          );
        }

        return response.json();
      })

      .then(data => {
        const updated =
          document.getElementById('updated');

        if (!Array.isArray(data.stocks)) {
          throw new Error(
            'Format dashboard.json invalide'
          );
        }

        if (data.updated_at) {
          const date =
            new Date(data.updated_at);

          updated.textContent =
            'Dernière mise à jour : ' +
            date.toLocaleString('fr-FR');
        } else {
          updated.textContent = '';
        }

        allStocks =
          data.stocks
            .map(item => {
              return {
                ...item,

                signalCalculated:
                  getSignal(item)
              };
            })

            .sort((a, b) => {
              const scoreA =
                safeNumber(a.global_score);

              const scoreB =
                safeNumber(b.global_score);

              if (scoreB !== scoreA) {
                return scoreB - scoreA;
              }

              return (
                safeNumber(b.trading_score) -
                safeNumber(a.trading_score)
              );
            })

            .map((item, index) => ({
              ...item,
              rank: index + 1
            }));

        updateSummary(allStocks);
        renderCards();
      })

      .catch(error => {
        console.error(error);

        document
          .getElementById('updated')
          .textContent = '';

        document
          .getElementById('cards-container')
          .innerHTML =
          '<div class="error">Erreur lors du chargement des données BRVM AI.</div>';
      });

    document
      .getElementById('search')
      .addEventListener(
        'input',
        renderCards
      );

    document
      .querySelectorAll('.filter-btn')
      .forEach(button => {

        button.addEventListener(
          'click',
          () => {

            document
              .querySelectorAll('.filter-btn')
              .forEach(btn => {
                btn.classList.remove('active');
              });

            button.classList.add('active');

            currentFilter =
              button.dataset.filter;

            renderCards();
          }
        );
      });
  </script>

</body>
</html>
