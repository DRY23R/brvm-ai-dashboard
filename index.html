<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRVM AI Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 22px;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 30px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 28px;
      font-size: 18px;
    }

    .card {
      background: #151b2f;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .symbol {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .score {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .green {
      color: #34d399;
    }

    .yellow {
      color: #fbbf24;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 17px;
      color: #d1d5db;
    }

    .status {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 12px;
      border-radius: 20px;
      background: #29304f;
      font-size: 13px;
      color: #e5e7eb;
    }

    .updated {
      color: #6b7280;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .error {
      background: #3f1d2b;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BRVM AI</h1>

    <div class="subtitle">
      Trading & Investment Scanner
    </div>

    <div id="updated"></div>

    <div id="cards-container"></div>

  </div>

  <script>
    fetch('dashboard.json?ts=' + Date.now())
      .then(response => {
        if (!response.ok) {
          throw new Error('Impossible de charger dashboard.json');
        }
        return response.json();
      })

      .then(data => {

        const container = document.getElementById('cards-container');
        const updated = document.getElementById('updated');

        container.innerHTML = '';

        if (data.updated_at) {
          const date = new Date(data.updated_at);

          updated.className = 'updated';
          updated.textContent =
            'Dernière mise à jour : ' +
            date.toLocaleString('fr-FR');
        }

        if (!Array.isArray(data.stocks)) {
          throw new Error('Format dashboard.json invalide');
        }

        data.stocks.forEach(item => {

          const score = Math.round(Number(item.trading_score || 0));
          const liquidity = Math.round(Number(item.liquidity_score || 0));
          const variation = Number(item.variation_pct || 0);
          const price = Number(item.last_price || 0);

          const scoreClass =
            score >= 75 ? 'green' : 'yellow';

          const card = document.createElement('div');

          card.className = 'card';

          card.innerHTML = `
            <div class="symbol">
              ${item.symbol}
            </div>

            <div class="score ${scoreClass}">
              ${score}/100
            </div>

            <div class="row">
              <span>Cours</span>
              <span>
                ${price.toLocaleString('fr-FR')} FCFA
              </span>
            </div>

            <div class="row">
              <span>Variation</span>
              <span>
                ${variation >= 0 ? '+' : ''}
                ${variation.toFixed(2)} %
              </span>
            </div>

            <div class="row">
              <span>Liquidité</span>
              <span>
                ${liquidity}/100
              </span>
            </div>

            <div class="status">
              ${
                item.signal === 'HISTORIQUE_INSUFFISANT'
                ? 'Historique insuffisant'
                : item.signal
              }
            </div>
          `;

          container.appendChild(card);
        });
      })

      .catch(error => {

        console.error(error);

        document.getElementById('cards-container').innerHTML =
          '<div class="error">Erreur de chargement des données.</div>';
      });
  </script>

</body>
</html>
